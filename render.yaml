services:
  # Web Service: Express API + Delivery Worker (Unified Process on Free Tier)
  - type: web
    name: hookrelay-backend
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma db push --schema=prisma/schema.postgresql.prisma
    startCommand: npm run start:all
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: hookrelay-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: ALLOW_LOCAL_DESTINATIONS
        value: "false"

# Managed PostgreSQL Database (Free tier)
databases:
  - name: hookrelay-db
    plan: free
    databaseName: hookrelay
    user: hookrelay_user
