services:
  # Web Service: Express API
  - type: web
    name: hookrelay-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install && npx prisma db push --schema=prisma/schema.postgresql.prisma
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: hookrelay-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "*"
      - key: ALLOW_LOCAL_DESTINATIONS
        value: "false"

  # Background Worker: Node.js Delivery Worker
  - type: worker
    name: hookrelay-worker
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm install
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: hookrelay-db
          property: connectionString
      - key: ALLOW_LOCAL_DESTINATIONS
        value: "false"

# Managed PostgreSQL Database shared by API and Worker
databases:
  - name: hookrelay-db
    plan: starter
    databaseName: hookrelay
    user: hookrelay_user
